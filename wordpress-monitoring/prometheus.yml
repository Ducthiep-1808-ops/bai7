global:
  scrape_interval: 15s

scrape_configs:

  # Prometheus tự giám sát chính nó
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # Host metrics
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # Docker container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  # MySQL metrics
  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql-exporter:9104"
